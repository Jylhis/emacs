sonar.projectKey=Jylhis_emacs
sonar.organization=jylhis


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=emacs
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Exclude all .java files -- Sonar's Java analyzer refuses to run
# without compiled .class files, which CI does not produce.  The
# java/ directory is the Android port; additional .java files live
# under test/ as CEDET parser test fixtures.
sonar.exclusions=java/**,**/*.java

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
