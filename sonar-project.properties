sonar.projectKey=Jylhis_emacs
sonar.organization=jylhis


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=emacs
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Keep the Meson build directory out of Sonar's generic indexer
# (object files, generated headers, Meson metadata).  The CFamily
# analyzer still consumes build/compile_commands.json -- this only
# affects the file-level walk used for SCM blame, duplications, etc.
# Also exclude all .java files -- Sonar's Java analyzer refuses to
# run without compiled .class files, which CI does not produce.
# The java/ directory is the Android port; additional .java files
# live under test/ as CEDET parser test fixtures.
sonar.exclusions=build/**,java/**,**/*.java

# C test-coverage import is configured per-run, not here.  The coverage
# build runs in .github/workflows/meson.yml (job "coverage") on dev
# pushes; it builds Emacs with -Db_coverage=true, runs ERT to exercise
# the C core, converts the gcov data to SonarQube generic XML with
# `gcovr --sonarqube`, and runs the scan in the same job, passing
# sonar.coverageReportPaths=coverage.xml via --define -- but only when
# the report exists.  Setting it unconditionally here would make scans
# without a report (e.g. PR scans) fail in the generic coverage
# importer, so it is deliberately left out of this file.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
