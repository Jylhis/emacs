sonar.projectKey=Jylhis_emacs
sonar.organization=jylhis


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=emacs
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Keep the Meson build directory out of Sonar's generic indexer
# (object files, generated headers, Meson metadata).  The CFamily
# analyzer still consumes build/compile_commands.json -- this only
# affects the file-level walk used for SCM blame, duplications, etc.
# Also exclude all .java files -- Sonar's Java analyzer refuses to
# run without compiled .class files, which CI does not produce.
# The java/ directory is the Android port; additional .java files
# live under test/ as CEDET parser test fixtures.
sonar.exclusions=build/**,java/**,**/*.java

# C test-coverage import.  The coverage build runs in
# .github/workflows/meson.yml (job "coverage"): it builds Emacs with
# -Db_coverage=true, runs the ERT suite to exercise the C core, and
# converts the gcov data to this SonarQube generic test-coverage XML
# with `gcovr --sonarqube`.  The SonarCloud workflow downloads that
# artifact and unpacks it here before scanning.  When the file is
# absent the scanner just reports no coverage; it does not fail.
sonar.coverageReportPaths=coverage.xml

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
