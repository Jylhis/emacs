sonar.projectKey=Jylhis_emacs
sonar.organization=jylhis


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=emacs
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Keep the Meson build directory out of Sonar's generic indexer
# (object files, generated headers, Meson metadata).  The CFamily
# analyzer still consumes build/compile_commands.json -- this only
# affects the file-level walk used for SCM blame, duplications, etc.
sonar.exclusions=build/**

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
