#
# Lint -> build -> test pipeline for the autotools tree.  The build
# matrix covers a GTK3 build with the optional feature set and a
# terminal-only --without-all build that gates against source files
# assuming HAVE_GTK3 et al.  A separate job evaluates the Nix flake
# and devenv environment when nix files change.

name: build

on:
  push:
    branches:
      - master
      - 'emacs-*'
      - 'feature/*'
      - 'fix/*'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs of the same workflow on the same ref so a
# new push doesn't queue behind a stale build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      actionlint: ${{ steps.classify.outputs.actionlint }}
      build: ${{ steps.classify.outputs.build }}
      nix: ${{ steps.classify.outputs.nix }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: bash .github/scripts/ci-classify.sh

  # ================================================================
  # Stage 1 -- Lint (cheap checks, no compilation)
  # ================================================================
  lint:
    name: lint
    needs: [classify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0   # full history for git diff

      # Whitespace check (replicates .git/hooks/pre-commit:84-85).
      - name: Check whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push; skipping whitespace check"
              exit 0
            fi
          fi
          git diff --check "$base" HEAD -- || {
            echo "::error::Whitespace errors found (trailing whitespace or SPC before TAB)"
            exit 1
          }

      # File naming (replicates .git/hooks/pre-commit:52-73).
      - name: Check new file names
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push; skipping file name check"
              exit 0
            fi
          fi
          bad=0
          for f in $(git diff --name-only --diff-filter=A "$base" HEAD); do
            case "$f" in
              -*|*/-*)
                echo "::error file=$f::File name component begins with '-'"
                bad=1 ;;
              ChangeLog.android) ;;
              ChangeLog|*/ChangeLog)
                echo "::error file=$f::Use git commit messages, not ChangeLog files"
                bad=1 ;;
            esac
            if echo "$f" | LC_ALL=C grep -qE '[^-+./_0-9A-Za-z]'; then
              echo "::error file=$f::File name contains non-ASCII or disallowed characters"
              bad=1
            fi
          done
          exit $bad

      # Commit message validation (replicates .git/hooks/commit-msg).
      # Only on PRs; pushes to master already passed local hooks.
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          status=0
          for sha in $(git rev-list "$base"..HEAD); do
            msg=$(git log --format=%B -n1 "$sha")
            # Skip merge commits
            if [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi
            # Skip Dependabot commits
            author=$(git log --format=%an -n1 "$sha")
            if [ "$author" = "dependabot[bot]" ]; then
              continue
            fi
            short=$(echo "$msg" | head -1)
            # First line must not start with whitespace
            if echo "$short" | grep -qE '^\s'; then
              echo "::error::Commit $sha: first line starts with whitespace"
              status=1
            fi
            # Second line must be blank (if it exists)
            second=$(echo "$msg" | sed -n '2p')
            if [ -n "$second" ] && echo "$second" | grep -qE '\S'; then
              echo "::error::Commit $sha: second line is not blank"
              status=1
            fi
            # No Signed-off-by
            if echo "$msg" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha: contains Signed-off-by"
              status=1
            fi
            # Line length (max 78 with spaces, 140 for single words)
            while IFS= read -r line; do
              expanded=$(echo "$line" | expand)
              len=${#expanded}
              if [ "$len" -gt 78 ] && echo "$expanded" | grep -q ' '; then
                echo "::error::Commit $sha: line >78 chars: $(echo "$expanded" | cut -c1-60)..."
                status=1
              fi
              if [ "$len" -gt 140 ]; then
                echo "::error::Commit $sha: word >140 chars"
                status=1
              fi
            done < <(echo "$msg" | grep -v '^#')
          done
          exit $status

      # Workflow YAML lint.
      - name: Lint GitHub Actions workflows
        if: needs.classify.outputs.actionlint == 'true'
        run: |
          # Pinned release, verified against the sha256 from the
          # published actionlint_1.7.12_checksums.txt.
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "$sha256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  # ================================================================
  # Stage 2+3 -- Build, then test
  # ================================================================
  build-and-test:
    name: build + test (${{ matrix.label }})
    needs: [classify, lint]
    if: needs.classify.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Don't fast-fail the gtk3 variant when the no-X variant breaks
      # (or vice versa); each gates a different feature surface.
      fail-fast: false
      matrix:
        include:
          - label: Linux/GTK3
            configure-args: >-
              --with-x-toolkit=gtk3
          # Terminal-only build, no window system, no optional
          # pkg-config deps.  Gates against source files that assume
          # HAVE_GTK3 et al.
          - label: Linux/no-X
            configure-args: >-
              --with-x=no
              --without-all
              --with-gnutls

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf texinfo gettext \
            libgnutls28-dev libncurses-dev libxml2-dev \
            libgtk-3-dev libxpm-dev libjpeg-dev libpng-dev libgif-dev \
            libtiff-dev librsvg2-dev libwebp-dev \
            libharfbuzz-dev libcairo2-dev \
            libsqlite3-dev libtree-sitter-dev libgmp-dev \
            libacl1-dev libdbus-1-dev liblcms2-dev libgpm-dev \
            libsystemd-dev

      # ---- Compiler cache --------------------------------------------
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ccache-${{ runner.os }}-${{ matrix.label }}
          max-size: 500M

      # ---- Build ------------------------------------------------------
      - name: autogen + configure
        env:
          CONFIGURE_ARGS: ${{ matrix.configure-args }}
        run: |
          set -o pipefail
          export CC="ccache gcc" CXX="ccache g++"
          ./autogen.sh
          # shellcheck disable=SC2086
          ./configure $CONFIGURE_ARGS 2>&1 | tee configure.log

      - name: make
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee compile.log

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Dump build diagnostics on failure
        if: failure()
        run: |
          echo "=== last 200 lines of compile.log ==="
          tail -200 compile.log || true
          echo "=== last 100 lines of configure.log ==="
          tail -100 configure.log || true
          echo "=== config.log tail ==="
          tail -100 config.log || true

      # ---- Smoke tests ------------------------------------------------
      - name: Smoke test emacs
        run: |
          test -x src/emacs
          src/emacs --batch --eval '(progn (princ (emacs-version)) (terpri))'
          src/emacs --batch --eval '(princ (* 6 7))' | grep -q 42

      # ---- ERT tests ----------------------------------------------------
      # A bounded, deterministic subset; the full `make check` suite is
      # too slow and flaky for required CI.
      - name: Run ERT test subset
        run: |
          make -C test \
            lisp/net/eww-tests \
            lisp/vc/vc-git-tests \
            lisp/image-tests \
            lisp/treesit-tests \
            lisp/subr-tests \
            src/fns-tests \
            src/editfns-tests

      - name: Dump test logs on failure
        if: failure()
        run: |
          find test -name '*.log' -newer configure.log \
            -exec sh -c 'echo "=== $1 ==="; tail -60 "$1"' _ {} \;

  # ================================================================
  # Nix flake + devenv evaluation (gated on nix file changes)
  # ================================================================
  nix-eval:
    name: nix flake + devenv
    needs: [classify, lint]
    if: needs.classify.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
        with:
          # Push only on pushes to master / emacs-* release branches.
          # PR runs (incl. fork PRs) and workflow_dispatch get
          # pull-only.  Empty token => cachix-action pull-only mode.
          cachix-auth-token: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/emacs-'))) && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Verify devenv toolchain
        run: |
          set -euo pipefail
          echo "cc:       $(command -v cc)"
          echo "autoconf: $(command -v autoconf)"
          echo "makeinfo: $(command -v makeinfo)"
          cc --version | head -1
          autoconf --version | head -1
          printf 'int main(void){return 0;}\n' > /tmp/sanity.c
          cc /tmp/sanity.c -o /tmp/sanity
          /tmp/sanity
          echo "Toolchain sanity check passed."

      # Evaluate (don't build) every flake output; catches nix syntax
      # and evaluation errors without compiling Emacs in CI.
      - name: nix flake check (evaluation only)
        run: nix flake check --no-build
