# Build the Meson tree (see
# .claude/plans/migrate-from-current-build-replicated-gadget.md)
# inside a devenv.sh shell so the toolchain comes from the same Nix
# pin as a developer's local environment.  See
# https://devenv.sh/integrations/github-actions/.

name: meson

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same ref so a
# new push doesn't queue behind a stale build.
concurrency:
  group: meson-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: meson + ninja (Linux/GTK3)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Nix + devenv setup -----------------------------------------
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix (jylhis + devenv binary caches)
        uses: cachix/cachix-action@v15
        with:
          name: jylhis
          extraPullNames: devenv

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      # ---- Build cache ------------------------------------------------
      # Cache the Meson build dir so incremental rebuilds reuse compiled
      # objects.  A change in any meson.build / workflow file
      # invalidates via the hashFiles key.  No restore-keys fallback --
      # a partial restore across configs is more harm than help.
      - name: Cache Meson build dir
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: |
            meson-build-${{ runner.os }}-${{ hashFiles('.github/workflows/meson.yml', 'meson.build', 'meson.options', 'meson/**', 'lib/meson.build', 'lib-src/meson.build', 'src/meson.build', 'admin/meson.build', 'lisp/meson.build', 'test/meson.build', 'doc/meson.build') }}

      # Source-tree generated artefacts cache (keyed on .el contents).
      - name: Cache source-tree byte-compile artefacts
        uses: actions/cache@v4
        with:
          path: |
            lisp/**/*.elc
            lisp/loaddefs.el
            lisp/**/*-loaddefs.el
            lisp/international/charscript.el
            lisp/international/emoji-zwj.el
            lisp/international/uni-*.el
            lisp/international/charprop.el
          key: |
            elc3-${{ runner.os }}-${{ hashFiles('lisp/**/*.el') }}

      # ---- Build ------------------------------------------------------
      # Every build step runs inside `devenv shell` so the meson, ninja,
      # gcc, gtk3, libgccjit, etc. all come from the Nix pin in
      # devenv.nix instead of the runner's apt repositories.
      - name: meson setup
        shell: devenv shell bash -- -e {0}
        run: |
          if [ ! -f build/meson-info/meson-info.json ]; then
            meson setup build
          else
            echo "Reusing cached build/ directory"
            meson setup --reconfigure build
          fi

      - name: meson compile (lib-src + temacs + bootstrap-emacs + emacs)
        shell: devenv shell bash -- -e {0}
        run: |
          set -o pipefail
          meson compile -C build --verbose 2>&1 | tee build/compile.log

      - name: Dump build diagnostics on failure
        if: failure()
        shell: devenv shell bash -- -e {0}
        run: |
          echo "=== last 200 lines of compile.log ==="
          tail -200 build/compile.log || true
          echo "=== meson-log.txt ==="
          tail -200 build/meson-logs/meson-log.txt || true

      # Post the verbose compile log to the PR so diagnostics are
      # visible without admin-rights log access.  Only fires on PRs.
      - name: Post build failure as PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sections = [];
            for (const [name, path] of [
              ['compile.log (last 8 KB)', 'build/compile.log'],
              ['meson-log.txt (last 4 KB)', 'build/meson-logs/meson-log.txt'],
            ]) {
              try {
                const text = fs.readFileSync(path, 'utf8');
                const slice = text.slice(name.includes('8') ? -8192 : -4096);
                sections.push(`<details><summary>${name}</summary>\n\n\`\`\`\n${slice}\n\`\`\`\n</details>`);
              } catch (e) {
                sections.push(`(no ${path}: ${e.message})`);
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '## Meson build failure on ' + context.sha.slice(0, 7) + '\n\n' + sections.join('\n\n'),
            });

      - name: meson compile bootstrap-emacs.pdmp
        shell: devenv shell bash -- -e {0}
        run: meson compile -C build bootstrap-emacs.pdmp

      - name: meson compile compile-first
        shell: devenv shell bash -- -e {0}
        run: meson compile -C build compile-first

      - name: meson compile loaddefs-stamp
        shell: devenv shell bash -- -e {0}
        run: meson compile -C build loaddefs-stamp

      - name: meson compile compile-main
        # ~75% of lisp/ byte-compiles cleanly today; the rest fall back
        # to .el at load time.  Continue on error.
        shell: devenv shell bash -- -e {0}
        continue-on-error: true
        run: meson compile -C build compile-main

      - name: meson compile emacs.pdmp
        shell: devenv shell bash -- -e {0}
        continue-on-error: true
        run: meson compile -C build emacs.pdmp

      # ---- Smoke tests ------------------------------------------------
      - name: Smoke test bootstrap-emacs
        shell: devenv shell bash -- -e {0}
        run: |
          test -x build/src/bootstrap-emacs
          test -f build/src/bootstrap-emacs.pdmp
          EMACSDATA="$PWD/etc" EMACSLOADPATH="$PWD/lisp" \
            build/src/bootstrap-emacs --batch \
              --eval '(princ (* 6 7))'

      - name: Smoke test full emacs (factorial)
        if: success()
        shell: devenv shell bash -- -e {0}
        continue-on-error: true
        run: |
          if [ -f build/lisp/emacs.pdmp ]; then
            EMACSDATA="$PWD/etc" EMACSDOC="$PWD/etc" EMACSLOADPATH="$PWD/lisp" \
              build/src/emacs --batch -Q \
                --dump-file=build/lisp/emacs.pdmp \
                --eval '(progn (defun f (n) (if (= 0 n) 1 (* n (f (- n 1)))))
                              (princ (f 10)))'
          else
            echo "build/lisp/emacs.pdmp not produced; skipping factorial test"
          fi

      - name: Verify lib-src binaries
        shell: devenv shell bash -- -e {0}
        run: |
          for bin in etags ebrowse emacsclient hexl make-docfile \
                    make-fingerprint movemail update-game-score; do
            echo "=== $bin ==="
            test -x build/lib-src/$bin
          done
          build/lib-src/etags --version | head -1

      # ---- Artefacts --------------------------------------------------
      - name: Upload Meson logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: |
            build/meson-logs/
          retention-days: 14

      - name: Upload pdumper images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdumper-images
          path: |
            build/src/bootstrap-emacs.pdmp
            build/lisp/emacs.pdmp
          retention-days: 14
          if-no-files-found: ignore
