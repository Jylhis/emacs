#
# Run SonarCloud's CFamily analyzer using the compile_commands.json
# that Meson emits during `meson setup`.  No full compilation is
# needed -- config.h is generated at setup time, and the analyzer
# handles missing generated headers (globals.h, buildobj.h) with
# reduced precision.  If this ever causes analysis gaps, add a
# targeted `meson compile -C build globals.h buildobj.h` step.
#
# Toolchain is set up via the shared .github/actions/setup-devenv
# composite action so meson and pkg-config probes use the same
# Nix-pinned packages as meson.yml and developers' local devenv shell.

name: SonarCloud

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel in-progress runs of the same workflow on the same ref so a
# new push doesn't queue behind a stale scan.
concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sonar: ${{ steps.classify.outputs.sonar }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: bash .github/scripts/ci-classify.sh

  analyze:
    name: SonarCloud analysis
    needs: [classify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub does not expose repository secrets (SONAR_TOKEN) to
    # workflows triggered from forked PRs, so the scan step would
    # fail with auth errors.  Skip the whole job for fork PRs --
    # build verification is already covered by meson.yml, and Sonar
    # re-runs on push to dev after the PR is merged.
    if: >-
      needs.classify.outputs.sonar == 'true'
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Shallow clones should be disabled for blame-based new-code
          # detection in SonarCloud.
          fetch-depth: 0

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
        with:
          # Sonar runs on dev pushes and same-repo PRs only (fork PRs
          # are skipped at the job-level if above).  Pull-only here;
          # meson.yml is the canonical pusher to jylhis.
          cachix-auth-token: ''

      # ---- Configure (no compile) ------------------------------------
      # Meson writes compile_commands.json and config.h during setup.
      - name: meson setup
        run: meson setup build

      # ---- SonarCloud scan -------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995  # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define "sonar.cfamily.compile-commands=build/compile_commands.json"
