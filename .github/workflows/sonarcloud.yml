name: SonarCloud

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint texinfo libgtk-3-dev libgnutls28-dev libjansson-dev libtree-sitter-dev

      - name: Download and unzip Build Wrapper
        run: |
          curl -sSLo build-wrapper-linux-x86.zip https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -o build-wrapper-linux-x86.zip

      - name: Configure and build with Build Wrapper
        run: |
          ./autogen.sh
          ./configure --without-x --without-dbus --without-gconf --without-selinux
          ./build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir bw-output make -j"$(nproc)"

      - name: Build Java sources for SonarJava
        run: |
          mkdir -p java/build/classes
          curl -sSLo android.jar https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar
          find java/org -name '*.java' -print0 | xargs -0 javac -classpath android.jar -d java/build/classes

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.compile-commands=bw-output/compile_commands.json
            -Dsonar.cfamily.build-wrapper-output=bw-output
            -Dsonar.java.binaries=java/build/classes
