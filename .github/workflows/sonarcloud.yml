#
# Run SonarCloud's CFamily analyzer against a compile_commands.json
# generated by intercepting the autotools build with Bear.  The C
# sources must actually compile for Bear to record their commands,
# so this configures and builds the C layer (src + lib + lib-src)
# but skips the lisp byte-compile and dump steps.

name: SonarCloud

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel in-progress runs of the same workflow on the same ref so a
# new push doesn't queue behind a stale scan.
concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sonar: ${{ steps.classify.outputs.sonar }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: bash .github/scripts/ci-classify.sh

  analyze:
    name: SonarCloud analysis
    needs: [classify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # GitHub does not expose repository secrets (SONAR_TOKEN) to
    # workflows triggered from forked PRs, so the scan step would
    # fail with auth errors.  Skip the whole job for fork PRs --
    # build verification is already covered by build.yml, and Sonar
    # re-runs on push to master after the PR is merged.
    if: >-
      needs.classify.outputs.sonar == 'true'
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Shallow clones should be disabled for blame-based new-code
          # detection in SonarCloud.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf texinfo gettext bear \
            libgnutls28-dev libncurses-dev libxml2-dev \
            libgtk-3-dev libxpm-dev libjpeg-dev libpng-dev libgif-dev \
            libtiff-dev librsvg2-dev libwebp-dev \
            libharfbuzz-dev libcairo2-dev \
            libsqlite3-dev libtree-sitter-dev libgmp-dev \
            libacl1-dev libdbus-1-dev liblcms2-dev libgpm-dev \
            libsystemd-dev

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ccache-${{ runner.os }}-sonarcloud
          max-size: 500M

      # ---- Configure + compile the C layer under Bear ------------------
      - name: configure and build C sources with Bear
        run: |
          export CC="ccache gcc" CXX="ccache g++"
          ./autogen.sh
          ./configure --with-x-toolkit=gtk3
          bear -- make -j"$(nproc)" -C lib all
          bear --append -- make -j"$(nproc)" -C lib-src all
          bear --append -- make -j"$(nproc)" -C src temacs

      # ---- SonarCloud scan -------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995  # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define "sonar.cfamily.compile-commands=compile_commands.json"
