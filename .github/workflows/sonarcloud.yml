#
# Run SonarCloud's CFamily analyzer using the compile_commands.json
# that Meson emits during `meson setup`.  No full compilation is
# needed -- config.h is generated at setup time, and the analyzer
# handles missing generated headers (globals.h, buildobj.h) with
# reduced precision.  If this ever causes analysis gaps, add a
# targeted `meson compile -C build globals.h buildobj.h` step.
#
# Toolchain is set up via the shared .github/actions/setup-devenv
# composite action so meson and pkg-config probes use the same
# Nix-pinned packages as meson.yml and developers' local devenv shell.

name: SonarCloud

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel in-progress runs of the same workflow on the same ref so a
# new push doesn't queue behind a stale scan.
concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sonar: ${{ steps.classify.outputs.sonar }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: bash .github/scripts/ci-classify.sh

  analyze:
    name: SonarCloud analysis
    needs: [classify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Needed to list/download the coverage artifact produced by the
      # meson.yml workflow's coverage job (see step below).
      actions: read
    # GitHub does not expose repository secrets (SONAR_TOKEN) to
    # workflows triggered from forked PRs, so the scan step would
    # fail with auth errors.  Skip the whole job for fork PRs --
    # build verification is already covered by meson.yml, and Sonar
    # re-runs on push to dev after the PR is merged.
    if: >-
      needs.classify.outputs.sonar == 'true'
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Shallow clones should be disabled for blame-based new-code
          # detection in SonarCloud.
          fetch-depth: 0

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
        with:
          # Sonar runs on dev pushes and same-repo PRs only (fork PRs
          # are skipped at the job-level if above).  Pull-only here;
          # meson.yml is the canonical pusher to jylhis.
          cachix-auth-token: ''

      # ---- Configure (no compile) ------------------------------------
      # Meson writes compile_commands.json and config.h during setup.
      - name: meson setup
        run: meson setup build

      # ---- Import C test coverage ------------------------------------
      # The instrumented coverage build is too expensive to run on every
      # scan, so meson.yml's `coverage` job produces it once per dev push
      # and uploads a `coverage-sonarqube` artifact.  Pull the most
      # recent such artifact off dev and unpack coverage.xml at the repo
      # root, where sonar.coverageReportPaths (set in
      # sonar-project.properties) expects it.  The coverage may lag the
      # scanned commit by a push; that is an accepted tradeoff for not
      # rebuilding an instrumented tree on every scan.  If no artifact is
      # found, the scan still runs -- SonarCloud just reports no
      # coverage for this run.
      - name: Download latest C coverage report
        id: cov
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'meson.yml',
              branch: 'dev', per_page: 30,
            });
            for (const run of runs.data.workflow_runs) {
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              const art = arts.data.artifacts.find(
                a => a.name === 'coverage-sonarqube' && !a.expired);
              if (!art) continue;
              const dl = await github.rest.actions.downloadArtifact({
                owner, repo, artifact_id: art.id, archive_format: 'zip',
              });
              fs.writeFileSync('coverage.zip', Buffer.from(dl.data));
              core.info(
                `Downloaded coverage-sonarqube from meson.yml run ${run.id} `
                + `(${run.head_sha.slice(0, 7)}).`);
              core.setOutput('found', 'true');
              return;
            }
            core.warning(
              'No coverage-sonarqube artifact found on dev; '
              + 'scanning without coverage data.');
            core.setOutput('found', 'false');

      - name: Unpack coverage report
        if: steps.cov.outputs.found == 'true'
        run: |
          unzip -o coverage.zip
          test -s coverage.xml

      # ---- SonarCloud scan -------------------------------------------
      # sonar.coverageReportPaths=coverage.xml is set in
      # sonar-project.properties; the scanner imports it when the file is
      # present and warns (without failing) when it is not.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995  # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define "sonar.cfamily.compile-commands=build/compile_commands.json"
